<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Set your password | STARONIC</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body class="auth-wrap" data-page="reset">
<main class="auth-main">
  <div class="auth-card">
    <h1>Set your password</h1>
    <div id="msg" aria-live="polite"></div>
    <p id="checking" class="muted">Checking your link...</p>
    <form id="reset-form" hidden novalidate>
      <p class="muted">Use at least 12 characters, with a lowercase letter, an uppercase letter and a number.</p>
      <label class="field"><span>New password</span><input type="password" name="password" autocomplete="new-password" maxlength="72" required></label>
      <label class="field"><span>Confirm new password</span><input type="password" name="confirm" autocomplete="new-password" maxlength="72" required></label>
      <button class="btn btn-block" type="submit">Save password</button>
    </form>
    <p><a href="/login.html">Back to sign in</a></p>
    <noscript><p class="alert alert-error">JavaScript is required on this page.</p></noscript>
  </div>
</main>
<script src="/js/vendor/supabase.js"></script>
<script type="module" src="/js/auth.js"></script>
</body>
</html>
